services:
  - type: web
    name: taskflow
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: taskflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/taskflow.sqlite
      - key: EMAIL_REMINDERS_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: https://projectdaily-hazel.vercel.app
      - key: APP_PUBLIC_URL
        value: https://projectdaily-hazel.vercel.app
