services:
  - type: web
    name: taskflow
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: EMAIL_REMINDERS_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: https://projectdaily-hazel.vercel.app
      - key: APP_PUBLIC_URL
        value: https://projectdaily-hazel.vercel.app
