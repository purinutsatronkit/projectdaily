sonar.projectKey=projectdaily

# SonarQube 9.9 uses a TypeScript analyzer that predates Bundler resolution.
sonar.typescript.tsconfigPaths=tsconfig.sonar.json

# Third-party Python packages bundled for report generation.
sonar.exclusions=tmp/video-report-doc/deps/**

# Tailwind CSS v4 compiles the @theme directive in this stylesheet.
sonar.issue.ignore.multicriteria=tailwindTheme
sonar.issue.ignore.multicriteria.tailwindTheme.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.tailwindTheme.resourceKey=apps/web/src/styles.css
