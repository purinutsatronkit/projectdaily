sonar.projectKey=projectdaily_DEV

# Analyze the application and maintained operational scripts, not temporary
# document-generation workspaces or vendored Python packages under tmp/.
sonar.sources=apps,packages,scripts,deploy,n8n
sonar.tests=tests,e2e

# SonarQube 9.9 uses a TypeScript analyzer that predates Bundler resolution.
sonar.typescript.tsconfigPaths=tsconfig.sonar.json

sonar.exclusions=**/node_modules/**,**/dist/**,tmp/**
